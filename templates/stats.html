<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener - Stats</title>
    <style>
        body {
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 40px;
        }
        h1 {
            margin-bottom: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #334155;
        }
        th {
            background: #334155;
        }
        a {
            color: #60a5fa;
        }
        .back {
            display: inline-block;
            margin-top: 20px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <h1>Shortened URLs</h1>
    <table>
        <tr>
            <th>Short Code</th>
            <th>Original URL</th>
            <th>Clicks</th>
            <th>Created</th>
        </tr>
        {% for row in urls %}
        <tr>
            <td><a href="/{{ row.ShortCode }}">{{ row.ShortCode }}</a></td>
            <td>{{ row.OriginalUrl }}</td>
            <td>{{ row.ClickCount }}</td>
            <td>{{ row.CreatedAt }}</td>
        </tr>
        {% endfor %}
    </table>
    <a class="back" href="/">Back to shortener</a>
</body>
</html>
